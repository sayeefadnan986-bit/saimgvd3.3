
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>VIBRANCY AI — Media Assistant</title>
<style>
:root {
  color-scheme: dark;
  --bg:#080b14;
  --panel:#111827;
  --line:#29364b;
  --text:#f4f7ff;
  --muted:#9ba9bf;
  --cyan:#5be7ff;
  --purple:#9b83ff;
}
* { box-sizing:border-box; }
body {
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,"Noto Sans Bengali",sans-serif;
}
button,input,select,textarea { font:inherit; }
button { cursor:pointer; }
button:disabled { opacity:.5;cursor:not-allowed; }
header {
  position:sticky;top:0;z-index:5;
  background:#0b1019ed;backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;
}
.brand { display:flex;align-items:center;gap:10px; }
.logo {
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  display:grid;place-items:center;color:#08111b;font-size:24px;
}
.brand strong { letter-spacing:1px; }
.brand small { display:block;color:var(--muted);font-size:11px;margin-top:3px; }
.status-dot { color:#73f1bd;font-size:12px; }
main { max-width:1000px;margin:auto;padding:22px 14px 190px; }
.welcome { text-align:center;padding:35px 8px 24px; }
.orb {
  width:88px;height:88px;margin:0 auto 20px;border-radius:50%;
  display:grid;place-items:center;font-size:39px;
  border:1px solid #51799c;
  background:radial-gradient(circle,#264a6a,#17152d 70%);
  box-shadow:0 0 45px #5be7ff20;
  animation:float 4s ease-in-out infinite;
}
@keyframes float {
  50% { transform:translateY(-7px); }
}
h1 { font-size:clamp(27px,5vw,42px);margin:0 0 12px; }
.gradient {
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  background-clip:text;-webkit-background-clip:text;color:transparent;
}
.welcome p { color:var(--muted);line-height:1.9; }
.suggestions {
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px;
}
.suggestion,.secondary {
  background:#141f32;color:var(--text);
  border:1px solid var(--line);border-radius:20px;padding:10px 13px;
}
.suggestion:hover,.secondary:hover { border-color:var(--cyan); }
#chat { display:flex;flex-direction:column;gap:22px; }
.message { display:flex;gap:9px;align-items:flex-start; }
.message.user { justify-content:flex-end; }
.avatar {
  width:34px;height:34px;flex:0 0 34px;border-radius:12px;
  background:#1a2942;display:grid;place-items:center;border:1px solid #34445e;
}
.message.user .avatar { order:2; }
.bubble {
  max-width:min(95%,850px);min-width:0;background:var(--panel);
  border:1px solid var(--line);border-radius:5px 17px 17px 17px;
  padding:14px;line-height:1.75;overflow-wrap:anywhere;flex:1;
}
.message.user .bubble {
  flex:0 1 auto;background:#18253c;border-radius:17px 5px 17px 17px;
}
.muted { color:var(--muted);font-size:12px; }
.error {
  border:1px solid #71434e;background:#27151e;
  color:#ffd3d9;padding:12px;border-radius:12px;font-size:13px;
  margin-top:12px;
}
.resultgrid {
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;margin-top:14px;
}
.media {
  border:1px solid var(--line);border-radius:13px;overflow:hidden;
  background:#090e18;min-width:0;
}
.media img,.media video {
  display:block;width:100%;aspect-ratio:4/3;
  object-fit:cover;background:#0b1220;
}
.media video { object-fit:contain; }
.media-body { padding:10px; }
.media-title { font-size:12px;line-height:1.6;overflow-wrap:anywhere; }
.source { font-size:10px;color:var(--muted);margin:4px 0 10px; }
.actions { display:flex;gap:6px; }
.actions a { flex:1;min-width:0;text-decoration:none; }
.primary,.secondary {
  display:inline-block;text-align:center;text-decoration:none;
  border-radius:10px;padding:9px 10px;font-size:12px;
}
.primary {
  background:linear-gradient(110deg,var(--cyan),#a58aff);
  color:#08111c;font-weight:800;border:0;
}
.actions .primary,.actions .secondary { width:100%;font-size:11px;padding:9px 3px; }
.loadmore { margin-top:14px; }
.toolbar {
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:#0b1019f5;border-top:1px solid var(--line);
  backdrop-filter:blur(18px);padding:10px 12px max(12px,env(safe-area-inset-bottom));
}
.composer { max-width:960px;margin:auto; }
.filters {
  display:none;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;margin:0 auto 10px;max-width:960px;
}
.filters.show { display:grid; }
.filters label { font-size:11px;color:var(--muted); }
.filters input,.filters select {
  display:block;width:100%;min-width:0;margin-top:5px;
  background:#111827;color:var(--text);border:1px solid var(--line);
  border-radius:9px;padding:9px;
}
.inputrow {
  display:flex;align-items:flex-end;gap:8px;max-width:960px;
  margin:auto;background:#111827;border:1px solid #35435a;
  border-radius:18px;padding:8px;
}
#prompt {
  flex:1;min-width:0;max-height:110px;resize:none;outline:none;
  border:0;background:transparent;color:var(--text);
  padding:10px 4px;line-height:1.5;
}
.iconbtn {
  flex:0 0 40px;width:40px;height:40px;border:1px solid var(--line);
  background:#1a263b;border-radius:13px;color:var(--text);
}
#send {
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  color:#08111b;border:0;font-size:20px;font-weight:900;
}
.composer-note { text-align:center;font-size:10px;color:#8794a8;margin-top:7px; }
a { color:var(--cyan); }
@media(min-width:650px) {
  .resultgrid { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media(min-width:900px) {
  .resultgrid { grid-template-columns:repeat(4,minmax(0,1fr)); }
}
@media(max-width:430px) {
  main { padding-left:9px;padding-right:9px; }
  .filters { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .bubble { padding:11px; }
  .resultgrid { gap:7px; }
  .media-body { padding:7px; }
  .actions .primary,.actions .secondary { font-size:10px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">✦</div>
    <div>
      <strong>VIBRANCY <span class="gradient">AI</span></strong>
      <small>Universal Media Assistant</small>
    </div>
  </div>
  <div class="status-dot" id="status">● Ready</div>
</header>

<main>
  <section class="welcome" id="welcome">
    <div class="orb">✧</div>
    <h1>Imagine it. <span class="gradient">Find it.</span></h1>
    <p>তুমি কী খুঁজছ আমাকে বলো। আমি বিভিন্ন মিডিয়া লাইব্রেরি থেকে<br>
      তোমার জন্য ছবি ও ভিডিও খুঁজে দেব।</p>
    <div class="suggestions">
      <button type="button" class="suggestion" data-q="আমাকে ১২টি মহাকাশের ছবি দেখাও">🌌 মহাকাশের ছবি</button>
      <button type="button" class="suggestion" data-q="আমাকে ৮টি প্রকৃতির ভিডিও দেখাও">🌿 প্রকৃতির ভিডিও</button>
      <button type="button" class="suggestion" data-q="আমাকে ২০টি ফুটবলের ছবি দেখাও">⚽ ফুটবলের ছবি</button>
    </div>
  </section>
  <section id="chat" aria-live="polite"></section>
</main>

<div class="toolbar">
  <section class="filters" id="filters">
    <label>মিডিয়ার ধরন
      <select id="kind">
        <option value="photo">ছবি</option>
        <option value="video">ভিডিও</option>
      </select>
    </label>
    <label>কতটি রেজাল্ট
      <input id="count" type="number" min="1" max="60" step="1" value="12">
    </label>
    <label>সার্চ সোর্স
      <select id="source">
        <option value="all">সব API সোর্স</option>
        <option value="pexels">Pexels</option>
        <option value="pixabay">Pixabay</option>
        <option value="unsplash">Unsplash</option>
        <option value="mixkit">Mixkit (ওয়েব সার্চ)</option>
      </select>
    </label>
  </section>
  <div class="composer">
    <div class="inputrow">
      <button type="button" class="iconbtn" id="filterBtn" title="ফিল্টার" aria-label="ফিল্টার">☷</button>
      <textarea id="prompt" rows="1" placeholder="আমাকে ২০টি পাহাড়ের ছবি দেখাও..." aria-label="মেসেজ লিখো"></textarea>
      <button type="button" class="iconbtn" id="send" aria-label="Send">➤</button>
    </div>
    <div class="composer-note">ছবি ও ভিডিও খোঁজার সহকারী · ফলাফল মূল সোর্স থেকে আসে</div>
  </div>
</div>

<script>
"use strict";

/*
  ঐচ্ছিক API keys:
  নিচের ফাঁকা স্ট্রিংয়ে নিজের key বসাও।
  পাবলিক ওয়েবসাইটে API key প্রকাশ না করে backend proxy ব্যবহার করো।
*/
const API = {
  PEXELS: "",
  PIXABAY: "58088897-ba06eba3bc15df54233381951",
  UNSPLASH: "jSk-OvCQz69SUVU9KR5U4SQZx7H4Z7Ei8rBexw9aPg8"
};

const $ = id => document.getElementById(id);
const chat = $("chat");
let busy = false;
let currentJob = null;

function safeURL(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

function addMessage(role, text) {
  $("welcome").style.display = "none";

  const row = document.createElement("div");
  row.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "☺" : "✦";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.append(avatar, bubble);
  chat.appendChild(row);
  row.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return bubble;
}

function addError(bubble, message) {
  const el = document.createElement("div");
  el.className = "error";
  el.textContent = message;
  bubble.appendChild(el);
}

function updateStatus(text) {
  $("status").textContent = text;
}

function parseRequest(text) {
  const digits = text.replace(/[০-৯]/g, d =>
    "০১২৩৪৫৬৭৮৯".indexOf(d)
  );

  const match = digits.match(
    /(?:আমাকে\s*)?(\d+)\s*(?:টি|টা|খানা|images?|photos?|pictures?|videos?|results?)/i
  );

  let count = match ? Number(match[1]) : Number($("count").value);

  if (!Number.isSafeInteger(count) || count < 1) {
    throw Error("রেজাল্টের সংখ্যা ১ বা তার বেশি পূর্ণসংখ্যা হতে হবে।");
  }

  count = Math.min(count, 60);
  $("count").value = count;

  let kind = $("kind").value;
  if (/ভিডিও|video|clips?|footage|ফুটেজ/i.test(digits)) {
    kind = "video";
  } else if (/ছবি|ছবির|photo|picture|image/i.test(digits)) {
    kind = "photo";
  }
  $("kind").value = kind;

  let query = digits
    .replace(/(?:আমাকে\s*)?\d+\s*(?:টি|টা|খানা|images?|photos?|pictures?|videos?|results?)/gi, " ")
    .replace(/\b(?:show|find|search|give|me|please|for|photos?|pictures?|images?|videos?|clips?|results?)\b/gi, " ")
    .replace(/আমাকে|দেখাও|দেখান|দাও|খুঁজে|খুঁজো|দেখতে|চাই|প্লিজ|ভিডিও|ছবি|ছবির|দেখিয়ে|দেখাতে/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  if (!query) query = digits.trim();

  return { query, count, kind };
}

function makeURL(base, params) {
  const url = new URL(base);
  Object.entries(params).forEach(([key, value]) => {
    if (value !== undefined && value !== null && value !== "") {
      url.searchParams.set(key, value);
    }
  });
  return url.href;
}

async function fetchJSON(url, headers = {}) {
  const response = await fetch(url, { headers });

  if (!response.ok) {
    throw Error("HTTP " + response.status);
  }
  return response.json();
}

async function searchPexels(query, kind, page) {
  if (!API.PEXELS) throw Error("Pexels API key সেট করা নেই");

  const video = kind === "video";
  const url = makeURL(
    video
      ? "https://api.pexels.com/videos/search"
      : "https://api.pexels.com/v1/search",
    { query, page, per_page: 40 }
  );

  const data = await fetchJSON(url, { Authorization: API.PEXELS });
  const rows = video ? (data.videos || []) : (data.photos || []);

  return {
    more: !!data.next_page,
    items: rows.map(item => {
      if (video) {
        const files = (item.video_files || [])
          .filter(file => file.link && file.file_type?.includes("video"))
          .sort((a, b) => (b.width || 0) - (a.width || 0));

        return {
          id: "pxv" + item.id,
          source: "Pexels",
          title: "Pexels video " + item.id,
          image: item.image,
          file: files[0]?.link || "",
          url: item.url,
          kind: "video"
        };
      }

      return {
        id: "pxp" + item.id,
        source: "Pexels",
        title: item.alt || "Pexels photo",
        image: item.src?.large || item.src?.medium,
        file: item.src?.original || "",
        url: item.url,
        kind: "photo"
      };
    })
  };
}

async function searchPixabay(query, kind, page) {
  if (!API.PIXABAY) throw Error("Pixabay API key সেট করা নেই");

  const video = kind === "video";
  const url = makeURL(
    video ? "https://pixabay.com/api/videos/" : "https://pixabay.com/api/",
    {
      key: API.PIXABAY,
      q: query,
      page,
      per_page: 100,
      safesearch: "true",
      ...(video ? {} : { image_type: "all" })
    }
  );

  const data = await fetchJSON(url);
  const rows = data.hits || [];

  return {
    more: page * 100 < (data.totalHits || 0) && page < 5,
    items: rows.map(item => {
      if (video) {
        const file = item.videos?.medium || item.videos?.small || item.videos?.tiny;
        return {
          id: "pbv" + item.id,
          source: "Pixabay",
          title: item.tags || "Pixabay video",
          image: file?.thumbnail || "",
          file: file?.url || "",
          url: item.pageURL,
          kind: "video"
        };
      }

      return {
        id: "pbi" + item.id,
        source: "Pixabay",
        title: item.tags || "Pixabay image",
        image: item.webformatURL || item.previewURL,
        file: item.largeImageURL || item.webformatURL,
        url: item.pageURL,
        kind: "photo"
      };
    })
  };
}

async function searchUnsplash(query, page) {
  if (!API.UNSPLASH) throw Error("Unsplash Access Key সেট করা নেই");

  const url = makeURL("https://api.unsplash.com/search/photos", {
    query,
    page,
    per_page: 30
  });

  const data = await fetchJSON(url, {
    Authorization: "Client-ID " + API.UNSPLASH
  });

  return {
    more: page * 30 < (data.total || 0) && page < 20,
    items: (data.results || []).map(item => ({
      id: "us" + item.id,
      source: "Unsplash",
      title: item.alt_description || item.description || "Unsplash photo",
      image: item.urls?.regular,
      file: item.urls?.full || item.urls?.regular,
      url: item.links?.html,
      kind: "photo"
    }))
  };
}

function getProviders(query, kind) {
  const selected = $("source").value;
  const providers = [];

  if (selected === "all" || selected === "pexels") {
    providers.push({
      name: "Pexels",
      run: page => searchPexels(query, kind, page)
    });
  }

  if (selected === "all" || selected === "pixabay") {
    providers.push({
      name: "Pixabay",
      run: page => searchPixabay(query, kind, page)
    });
  }

  if (kind === "photo" &&
      (selected === "all" || selected === "unsplash")) {
    providers.push({
      name: "Unsplash",
      run: page => searchUnsplash(query, page)
    });
  }

  return providers;
}

function sourceSearchLinks(query, kind) {
  const q = encodeURIComponent(query);
  return {
    Pexels: `https://www.pexels.com/search/${kind === "video" ? "videos" : "photos"}/${q}/`,
    Pixabay: `https://pixabay.com/${kind === "video" ? "videos" : "images"}/search/${q}/`,
    Unsplash: `https://unsplash.com/s/photos/${q}`,
    Mixkit: `https://mixkit.co/free-stock-video/?q=${q}`
  };
}

function addSourceLinks(bubble, query, kind) {
  const section = document.createElement("p");
  section.className = "muted";
  section.appendChild(document.createTextNode("সরাসরি সোর্সে খুঁজুন: "));

  const links = sourceSearchLinks(query, kind);
  const selected = $("source").value;

  Object.entries(links)
    .filter(([name]) =>
      selected === "all" ||
      name.toLowerCase() === selected ||
      (selected === "mixkit" && name === "Mixkit")
    )
    .forEach(([name, url]) => {
      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.style.marginRight = "10px";
      link.textContent = name;
      section.appendChild(link);
    });

  bubble.appendChild(section);
}

function renderCards(items) {
  const grid = document.createElement("div");
  grid.className = "resultgrid";

  items.forEach(item => {
    const card = document.createElement("article");
    card.className = "media";

    const imageURL = safeURL(item.image);
    const fileURL = safeURL(item.file);
    const pageURL = safeURL(item.url);

    if (item.kind === "video" && fileURL) {
      const video = document.createElement("video");
      video.controls = true;
      video.playsInline = true;
      video.preload = "none";

      if (imageURL) video.poster = imageURL;

      const videoSource = document.createElement("source");
      videoSource.src = fileURL;
      video.appendChild(videoSource);
      card.appendChild(video);
    } else if (imageURL) {
      const image = document.createElement("img");
      image.loading = "lazy";
      image.src = imageURL;
      image.alt = item.title;
      card.appendChild(image);
    } else {
      const placeholder = document.createElement("div");
      placeholder.style.cssText =
        "aspect-ratio:4/3;display:grid;place-items:center;color:#9ba9bf";
      placeholder.textContent = "MEDIA";
      card.appendChild(placeholder);
    }

    const body = document.createElement("div");
    body.className = "media-body";

    const title = document.createElement("div");
    title.className = "media-title";
    title.textContent = item.title;

    const source = document.createElement("div");
    source.className = "source";
    source.textContent = "Source: " + item.source;

    const actions = document.createElement("div");
    actions.className = "actions";

    function addLink(url, text, primary) {
      if (!url) return;

      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.className = primary ? "primary" : "secondary";
      link.textContent = text;
      actions.appendChild(link);
    }

    addLink(fileURL || pageURL, "↓ Open / Download", true);
    addLink(pageURL, "Source ↗", false);

    body.append(title, source, actions);
    card.appendChild(body);
    grid.appendChild(card);
  });

  return grid;
}

function renderResults(job, bubble) {
  bubble.replaceChildren();

  const heading = document.createElement("p");
  heading.textContent =
    `তোমার জন্য ${job.items.length}টি রেজাল্ট পাওয়া গেছে।`;
  bubble.appendChild(heading);

  if (job.items.length) {
    bubble.appendChild(renderCards(job.items));
  } else {
    const note = document.createElement("p");
    note.textContent =
      "API থেকে কোনো ফলাফল পাওয়া যায়নি। নিচের সোর্স লিংকে সরাসরি সার্চ করতে পারো।";
    bubble.appendChild(note);
  }

  if (job.errors.length) {
    addError(
      bubble,
      "কিছু API কাজ করেনি। API key, ইন্টারনেট সংযোগ এবং API quota পরীক্ষা করো।"
    );
  }

  addSourceLinks(bubble, job.query, job.kind);

  const activeProviders = job.providers.some(
    provider => !job.dead.has(provider.name)
  );

  if (job.items.length < job.target && activeProviders) {
    const more = document.createElement("button");
    more.type = "button";
    more.className = "secondary loadmore";
    more.textContent = "আরও রেজাল্ট খোঁজো";
    more.addEventListener("click", async () => {
      if (busy) return;
      job.target = Math.min(job.target + 12, 100);
      await collect(job, bubble);
    });
    bubble.appendChild(more);
  }
}

async function collect(job, bubble) {
  if (busy) return;

  busy = true;
  updateStatus("● Searching...");
  const sendButton = $("send");
  sendButton.disabled = true;

  try {
    while (job.items.length < job.target) {
      const active = job.providers.filter(
        provider => !job.dead.has(provider.name)
      );

      if (!active.length) break;

      const results = await Promise.all(active.map(async provider => {
        try {
          const page = job.pages[provider.name] || 1;
          const data = await provider.run(page);
          job.pages[provider.name] = page + 1;

          if (!data.more || !data.items.length) {
            job.dead.add(provider.name);
          }

          return { provider: provider.name, data };
        } catch (error) {
          job.dead.add(provider.name);
          job.errors.push(provider.name + ": " + error.message);
          return { provider: provider.name, data: { items: [], more: false } };
        }
      }));

      let added = 0;

      for (const result of results) {
        for (const item of result.data.items) {
          if (!job.seen.has(item.id)) {
            job.seen.add(item.id);
            job.items.push(item);
            added++;
          }
        }
      }

      if (added === 0) break;
    }

    renderResults(job, bubble);
  } catch (error) {
    addError(bubble, "সমস্যা হয়েছে: " + error.message);
  } finally {
    busy = false;
    sendButton.disabled = false;
    updateStatus("● Ready");
  }
}

async function sendMessage(overrideText) {
  if (busy) return;

  const text = (overrideText ?? $("prompt").value).trim();
  if (!text) {
    $("prompt").focus();
    return;
  }

  $("prompt").value = "";
  $("prompt").style.height = "auto";
  addMessage("user", text);

  let request;
  try {
    request = parseRequest(text);
  } catch (error) {
    addMessage("bot", error.message);
    return;
  }

  const { query, count, kind } = request;
  const selected = $("source").value;

  // Mixkit does not have the API integration implemented here.
  // Still make the search action useful by opening its public search page.
  if (selected === "mixkit") {
    const bubble = addMessage(
      "bot",
      "Mixkit-এর সরাসরি সার্চ লিংক নিচে দেওয়া হয়েছে।"
    );
    addSourceLinks(bubble, query, kind);
    return;
  }

  const providers = getProviders(query, kind);

  const job = {
    query,
    count,
    kind,
    target: count,
    providers,
    pages: {},
    dead: new Set(),
    seen: new Set(),
    items: [],
    errors: []
  };

  currentJob = job;

  const bubble = addMessage("bot", "তোমার মিডিয়া খোঁজা হচ্ছে...");
  const hasKey = providers.some(provider =>
    (provider.name === "Pexels" && !!API.PEXELS) ||
    (provider.name === "Pixabay" && !!API.PIXABAY) ||
    (provider.name === "Unsplash" && !!API.UNSPLASH)
  );

  if (!hasKey) {
    bubble.replaceChildren();

    const explanation = document.createElement("p");
    explanation.textContent =
      "API key সেট করা নেই, তাই অ্যাপ থেকে সরাসরি মিডিয়া আনা যাচ্ছে না। তবে নিচের সোর্স লিংকগুলো কাজ করবে।";
    bubble.appendChild(explanation);

    addSourceLinks(bubble, query, kind);

    const hint = document.createElement("p");
    hint.className = "muted";
    hint.textContent =
      "API ফলাফল পেতে HTML-এর API অংশে নিজের key যোগ করো। নিরাপদ প্রোডাকশন অ্যাপে backend proxy ব্যবহার করো।";
    bubble.appendChild(hint);
    return;
  }

  await collect(job, bubble);
}

// Send button
$("send").addEventListener("click", () => sendMessage());

// Enter to send; Shift+Enter adds a new line.
$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    sendMessage();
  }
});

// Auto-resize the input.
$("prompt").addEventListener("input", () => {
  const input = $("prompt");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 110) + "px";
});

// Toggle filters
$("filterBtn").addEventListener("click", () => {
  $("filters").classList.toggle("show");
});

// Suggestion buttons
document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => {
    sendMessage(button.dataset.q || "");
  });
});

// Keep the chosen number available for requests without a number.
$("count").addEventListener("change", () => {
  const value = Number($("count").value);
  if (!Number.isSafeInteger(value) || value < 1) {
    $("count").value = 12;
  } else {
    $("count").value = Math.min(value, 60);
  }
});

$("kind").addEventListener("change", () => {
  $("prompt").focus();
});

$("source").addEventListener("change", () => {
  $("prompt").focus();
});
</script>
